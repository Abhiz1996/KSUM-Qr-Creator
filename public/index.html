<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>KSUM QR Creator</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body class="public-page">
    <header class="public-topbar">
      <div>
        <p class="eyebrow">KSUM QR Creator</p>
        <h1>Create a tracked QR code</h1>
      </div>
      <a class="admin-link" href="/admin">Admin login</a>
    </header>

    <main class="public-workspace">
      <section class="panel composer public-composer" aria-label="QR creator">
        <form id="publicQrForm">
          <div class="form-head">
            <div>
              <p class="eyebrow">Create</p>
              <h2>Shareable QR</h2>
            </div>
            <span class="tracking-pill">Tracking on</span>
          </div>

          <label>
            Name
            <input id="name" name="name" placeholder="Event registration" required>
          </label>

          <div class="grid two">
            <label>
              Type
              <select id="type" name="type">
                <option value="url">Website URL</option>
                <option value="text">Plain text</option>
                <option value="email">Email</option>
                <option value="sms">SMS</option>
                <option value="wifi">WiFi</option>
                <option value="vcard">vCard</option>
                <option value="whatsapp">WhatsApp</option>
              </select>
            </label>
            <label>
              Error correction
              <select id="errorCorrection">
                <option value="M">Balanced</option>
                <option value="Q">High</option>
                <option value="H">Logo safe</option>
                <option value="L">Compact</option>
              </select>
            </label>
          </div>

          <label>
            Destination / data
            <textarea id="destination" rows="4" placeholder="https://example.com" required></textarea>
          </label>

          <div class="grid three">
            <label>
              Foreground
              <input type="color" id="foreground" value="#111827">
            </label>
            <label>
              Background
              <input type="color" id="background" value="#ffffff">
            </label>
            <label>
              Accent
              <input type="color" id="accent" value="#2dd4bf">
            </label>
          </div>

          <div class="grid three">
            <label>
              Frame
              <select id="frame">
                <option value="none">None</option>
                <option value="scan">Scan me</option>
                <option value="ticket">Ticket</option>
                <option value="badge">Badge</option>
              </select>
            </label>
            <label>
              Logo text
              <input id="logoText" maxlength="3" placeholder="AC">
            </label>
            <label>
              Size
              <input type="range" id="size" min="180" max="520" value="280">
            </label>
          </div>

          <p class="form-status" id="formStatus"></p>

          <div class="actions">
            <button type="submit" class="primary">Create QR</button>
            <button type="button" id="resetQr">New</button>
          </div>
        </form>
      </section>

      <section class="panel preview-card public-preview" aria-label="QR preview">
        <div id="qrPreview" class="qr-preview"></div>
        <p id="shortUrl" class="short-url"></p>
        <div class="download-row">
          <button id="copyLink" type="button">Copy link</button>
          <button id="downloadPng" type="button">PNG</button>
          <button id="downloadSvg" type="button">SVG</button>
        </div>
      </section>
    </main>

    <script src="vendor/qrcode.js"></script>
    <script src="create.js"></script>
  </body>
</html>
